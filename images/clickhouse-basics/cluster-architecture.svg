<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Hiragino Sans','Yu Gothic','Meiryo',sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="720" height="440" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">分散構成：シャーディング × レプリケーション</text>

  <g font-size="14" text-anchor="middle" fill="#222">
    <!-- Client -->
    <rect x="270" y="50" width="180" height="36" rx="6" stroke="#757575" stroke-width="1.5" fill="#eeeeee"/>
    <text x="360" y="73">クライアント</text>
    <text x="372" y="106" font-size="12" fill="#666">SELECT count(*) FROM distributed_table</text>

    <!-- Distributed -->
    <rect x="220" y="118" width="280" height="44" rx="6" stroke="#1e88e5" stroke-width="2" fill="#e3f2fd"/>
    <text x="360" y="145">Distributed テーブル（仮想テーブル）</text>

    <!-- Shards -->
    <g stroke="#fb8c00" stroke-width="1.5" fill="#fff8e1">
      <rect x="20" y="215" width="210" height="150" rx="8"/>
      <rect x="255" y="215" width="210" height="150" rx="8"/>
      <rect x="490" y="215" width="210" height="150" rx="8"/>
    </g>
    <text x="125" y="238" font-weight="bold">Shard 1</text>
    <text x="360" y="238" font-weight="bold">Shard 2</text>
    <text x="595" y="238" font-weight="bold">Shard 3</text>

    <g stroke="#43a047" stroke-width="1.5" fill="#e8f5e9">
      <rect x="35" y="252" width="180" height="42" rx="5"/><rect x="35" y="304" width="180" height="42" rx="5"/>
      <rect x="270" y="252" width="180" height="42" rx="5"/><rect x="270" y="304" width="180" height="42" rx="5"/>
      <rect x="505" y="252" width="180" height="42" rx="5"/><rect x="505" y="304" width="180" height="42" rx="5"/>
    </g>
    <g font-size="12">
      <text x="125" y="271">Replica A</text><text x="125" y="287" fill="#2e7d32">ReplicatedMergeTree</text>
      <text x="125" y="323">Replica B</text><text x="125" y="339" fill="#2e7d32">ReplicatedMergeTree</text>
      <text x="360" y="271">Replica A</text><text x="360" y="287" fill="#2e7d32">ReplicatedMergeTree</text>
      <text x="360" y="323">Replica B</text><text x="360" y="339" fill="#2e7d32">ReplicatedMergeTree</text>
      <text x="595" y="271">Replica A</text><text x="595" y="287" fill="#2e7d32">ReplicatedMergeTree</text>
      <text x="595" y="323">Replica B</text><text x="595" y="339" fill="#2e7d32">ReplicatedMergeTree</text>
    </g>

    <!-- Keeper -->
    <rect x="20" y="385" width="680" height="38" rx="6" stroke="#8e24aa" stroke-width="1.5" fill="#f3e5f5"/>
    <text x="360" y="409">ClickHouse Keeper：どのレプリカがどのパートを持つかを調整</text>
  </g>

  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="360" y1="86" x2="360" y2="116"/>
    <line x1="300" y1="162" x2="140" y2="213"/>
    <line x1="360" y1="162" x2="360" y2="213"/>
    <line x1="420" y1="162" x2="580" y2="213"/>
  </g>
  <text x="50" y="190" font-size="12" fill="#666">count=120</text>
  <text x="372" y="195" font-size="12" fill="#666">count=98</text>
  <text x="600" y="195" font-size="12" fill="#666">count=133</text>
  <text x="600" y="140" font-size="13" fill="#2e7d32">合計 351 を返す</text>
</svg>
