<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Hiragino Sans','Yu Gothic','Meiryo',sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">MergeTree：パート分割とバックグラウンドマージ</text>

  <g font-size="15" text-anchor="middle" fill="#222">
    <g stroke="#1e88e5" stroke-width="1.5" fill="#e3f2fd">
      <rect x="20" y="55" width="130" height="44" rx="6"/>
      <rect x="20" y="130" width="130" height="44" rx="6"/>
      <rect x="20" y="205" width="130" height="44" rx="6"/>
    </g>
    <text x="85" y="83">INSERT A</text><text x="85" y="158">INSERT B</text><text x="85" y="233">INSERT C</text>

    <g stroke="#fb8c00" stroke-width="1.5" fill="#fff3e0">
      <rect x="250" y="55" width="130" height="44" rx="6"/>
      <rect x="250" y="130" width="130" height="44" rx="6"/>
      <rect x="250" y="205" width="130" height="44" rx="6"/>
    </g>
    <text x="315" y="83">Part_1</text><text x="315" y="158">Part_2</text><text x="315" y="233">Part_3</text>

    <rect x="530" y="95" width="170" height="110" rx="8" stroke="#43a047" stroke-width="2" fill="#e8f5e9"/>
    <text x="615" y="140">Part_1_2_3</text>
    <text x="615" y="165" font-size="13" fill="#2e7d32">1つの大きな</text>
    <text x="615" y="185" font-size="13" fill="#2e7d32">ソート済みパート</text>
  </g>

  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="150" y1="77" x2="248" y2="77"/>
    <line x1="150" y1="152" x2="248" y2="152"/>
    <line x1="150" y1="227" x2="248" y2="227"/>
    <line x1="380" y1="77" x2="528" y2="130"/>
    <line x1="380" y1="152" x2="528" y2="150"/>
    <line x1="380" y1="227" x2="528" y2="172"/>
  </g>
  <text x="450" y="280" font-size="13" fill="#666" text-anchor="middle">バックグラウンドで自動マージ</text>
  <text x="200" y="45" font-size="12" fill="#666" text-anchor="middle">追記だけなので高速</text>
</svg>
